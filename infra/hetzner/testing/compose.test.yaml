# TEST-STACK OVERLAY — local and CI only. Never deployed to the Hetzner TEST environment or to
# production (ADR-0026 §6, §10).
#
#   docker compose -f infra/hetzner/compose.yaml -f infra/hetzner/testing/compose.test.yaml …
#
# It adds two services to the production-shaped template, and relaxes one backup check (below):
#
#   storage   MinIO, built from the same pinned source CI uses, standing in for the external
#             S3-compatible store a real deployment names in config/api.env. A passing run proves the
#             product's presigned upload + SHA-256 checksum contract against MINIO ONLY. It says
#             nothing about Hetzner Object Storage or Cloudflare R2 (ADR-0026 §10, gate P-1).
#   smoke     the end-to-end check (testing/smoke.mjs), run on the stack's own networks.
#
# Both sit on `ci-storage`, an internal network that only the API, MinIO and the smoke runner join.
# The presigned URLs the API issues name `http://storage:9000`; a browser could not resolve that,
# so the smoke runner plays the browser from inside the network. With a real provider the API and the
# browser both reach its public HTTPS endpoint, and that path is what gate P-1 must test.

services:
  storage:
    # Paths in an overlay resolve against the first file (infra/hetzner/), not this one.
    build: ./testing/minio
    image: munaxa-docs-test-minio:local
    env_file:
      - ${DOCS_CONFIG_DIR}/minio.env
    volumes:
      - storage-data:/data
    networks:
      - ci-storage
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

  storage-init:
    profiles: ['test']
    image: munaxa-docs-test-minio:local
    env_file:
      - ${DOCS_CONFIG_DIR}/minio.env
    # The bucket the API's STORAGE_BUCKET names, with versioning on, as the production store must
    # have (backup-and-restore.md §1). The alias comes from the environment, not a config file.
    #
    # Also the stand-in for the OFF-SERVER backup bucket (README.md §7): a second, versioned bucket and
    # a credential that may list, read and add objects there but never delete one — the shape the
    # real provider's key must have. It proves the copy job against MinIO only.
    entrypoint:
      - sh
      - -c
      - >-
        export MC_HOST_t="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@storage:9000" &&
        mc mb --ignore-existing t/munaxa-docs-test &&
        mc version enable t/munaxa-docs-test &&
        mc mb --ignore-existing t/munaxa-docs-offsite-test &&
        mc version enable t/munaxa-docs-offsite-test &&
        printf '%s' '{"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::munaxa-docs-offsite-test"]},
        {"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::munaxa-docs-offsite-test/*"]}]}'
        > /tmp/offsite-policy.json &&
        mc admin user add t "$$OFFSITE_TEST_KEY_ID" "$$OFFSITE_TEST_SECRET" &&
        mc admin policy create t offsite-append /tmp/offsite-policy.json &&
        mc admin policy attach t offsite-append --user "$$OFFSITE_TEST_KEY_ID"
    networks:
      - ci-storage
    depends_on:
      storage:
        condition: service_healthy

  smoke:
    profiles: ['test']
    image: ${DOCS_API_IMAGE}
    entrypoint: ['node', '/smoke/smoke.mjs']
    env_file:
      - ${DOCS_CONFIG_DIR}/smoke.env
    volumes:
      - ./testing/smoke.mjs:/smoke/smoke.mjs:ro
    networks:
      - edge
      - ci-storage

  api:
    networks:
      - ci-storage
    depends_on:
      storage:
        condition: service_healthy

  # The off-server copy reaches the stand-in bucket on the test network (a real deployment reaches
  # its provider over offsite-egress).
  offsite:
    networks:
      - offsite-egress
      - ci-storage

  # The backup scripts refuse a backup volume on the database's own filesystem. A CI runner has one
  # disk, so the stack test relaxes that unless STACKTEST_BACKUP_DIR names a separate filesystem
  # (run-stack-test.sh). The refusal itself is tested by testing/backup/test-backup-scripts.sh.
  postgres:
    environment:
      BACKUP_ALLOW_SAME_DEVICE: ${STACKTEST_BACKUP_ALLOW_SAME_DEVICE:-1}

  db-backup:
    environment:
      BACKUP_ALLOW_SAME_DEVICE: ${STACKTEST_BACKUP_ALLOW_SAME_DEVICE:-1}

networks:
  ci-storage:
    internal: true
    ipam:
      config:
        - subnet: 172.28.20.0/24

volumes:
  storage-data:
