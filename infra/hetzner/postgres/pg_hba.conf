# Client authentication for the Hetzner template's PostgreSQL — loaded with
# `-c hba_file=/etc/munaxa-postgres/pg_hba.conf` (compose.yaml).
#
# The official image's own rules, unchanged, plus ONE line: the backup role may open a replication
# connection (pg_basebackup), from the private `data` network only, with a password.
#
# TYPE  DATABASE     USER         ADDRESS            METHOD

# Inside the container: the image's health check and the operator's `psql` over the socket.
local   all          all                             trust
local   replication  all                             trust
host    all          all          127.0.0.1/32       trust
host    all          all          ::1/128            trust
host    replication  all          127.0.0.1/32       trust
host    replication  all          ::1/128            trust

# Base backups: only edms_backup, only from the data network (compose.yaml, 172.28.11.0/24).
host    replication  edms_backup  172.28.11.0/24     scram-sha-256

# Everything else, as the image configures it: passwords, from anywhere that can reach the port —
# which is only the data network, since nothing publishes it.
host    all          all          all                scram-sha-256
