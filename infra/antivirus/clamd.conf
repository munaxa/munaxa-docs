# ClamAV's daemon, as the validation scanner behind ./c-icap.conf. Test and development
# infrastructure; see that file for the three properties any production ICAP scanner must hold.
# Paths are the Debian/Ubuntu `clamav-daemon` package's; signatures come from `freshclam`.

TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
Foreground false
DatabaseDirectory /var/lib/clamav
PidFile /var/run/clamav/clamd.pid
ReadTimeout 180
# At least the product's largest upload, so nothing it accepts is too large to scan.
StreamMaxLength 2048M
MaxScanSize 2048M
MaxFileSize 2048M
# REQUIRED: a file past any scan limit is reported (Heuristics.Limits.Exceeded) rather than passed
# as OK without being read in full.
AlertExceedsMax yes
