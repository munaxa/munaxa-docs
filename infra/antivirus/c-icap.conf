# The ICAP scanner the product's `AV_DRIVER=ICAP` adapter is validated against: c-icap's
# `virus_scan` service in front of ClamAV's clamd. Test and development infrastructure — the same
# posture as MinIO in ../docker-compose.yml. A production deployment runs its own ICAP scanner, but
# whichever it runs must hold the properties marked REQUIRED below
# (docs/operations/deployment.md, "Antivirus").
#
# Paths below are the Debian/Ubuntu package's (`c-icap`, `libc-icap-mod-virus-scan`).

Port 127.0.0.1:1344
PidFile /var/run/c-icap/c-icap.pid
CommandsSocket /var/run/c-icap/c-icap.ctl
Timeout 300
MaxKeepAliveRequests 100
KeepAliveTimeout 600
StartServers 1
MaxServers 4
MinSpareThreads 4
MaxSpareThreads 16
ThreadsPerChild 8
MaxRequestsPerChild 0
TmpDir /tmp
MaxMemObject 131072
DebugLevel 1
Pipelining on
ModulesDir /usr/lib/x86_64-linux-gnu/c_icap
ServicesDir /usr/lib/x86_64-linux-gnu/c_icap
TemplateDir /usr/share/c_icap/templates/
TemplateDefaultLanguage en
LoadMagicFile /etc/c-icap/c-icap.magic
ServerLog /var/log/c-icap/server.log
AccessLog /var/log/c-icap/access.log

# clamd over TCP, so the scanner engine can be stopped independently of the ICAP server.
Module common clamd_mod.so
clamd_mod.ClamdHost 127.0.0.1
clamd_mod.ClamdPort 3310

Service antivirus_module virus_scan.so
# REQUIRED: `mode=simple` — scan the whole object, then answer. c-icap's default for objects past a
# couple of megabytes streams the content back with a `200` before the scan finishes and cuts the
# stream if it finds something; that answer carries no verdict, and the adapter refuses it (FAILED).
ServiceAlias avscan virus_scan?allow204=on&mode=simple
virus_scan.DefaultEngine clamd
# REQUIRED: every type group c-icap knows. A group left out is passed as clean without a scan.
virus_scan.ScanFileTypes TEXT DATA EXECUTABLE ARCHIVE GRAPHICS STREAM DOCUMENT
# REQUIRED: at least the product's largest upload (STORAGE_MAX_UPLOAD_BYTES and AV_ICAP_MAX_BYTES).
# An object above this is passed as clean without a scan.
virus_scan.MaxObjectSize 2048M
# REQUIRED: an engine error is an error, never a pass.
virus_scan.PassOnError off
virus_scan.Allow204Responces on
virus_scan.SendPercentData 0
virus_scan.StartSendPercentDataAfter 2048M
