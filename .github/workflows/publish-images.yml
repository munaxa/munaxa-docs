# Publishing the production images to Amazon ECR, so a deployment pulls an artifact that was built
# and verified here rather than building one itself — and pins it by digest.
#
# Three images, each from one named commit, in 229251310592.dkr.ecr.eu-central-1.amazonaws.com:
#
#   munaxa-docs/api        the `api` target of ./Dockerfile
#   munaxa-docs/web        the `web` target of ./Dockerfile
#   munaxa-docs/antivirus  ./infra/antivirus — c-icap in front of ClamAV
#
# **No registry credential exists.** Every job that touches ECR runs in the protected
# `image-release` environment and assumes the image publisher role
# (infra/terraform/bootstrap/ecr.tf) through GitHub OIDC. The role's trust requires that environment,
# an image/* tag, this workflow file and this repository's IDs, and the role may only push to those
# three repositories. Production pulls with the ECS execution roles' IAM permissions.
#
# **Tag-triggered, and the tag names the commit to build.** Publishing is a decision about one
# validated commit, not something every push should do. The trigger is a tag of the form
#
#   image/<full 40-character commit SHA>
#
# **Only reviewed history is published.** The tag must point at the commit it names, and that commit
# must be on `main`, which only accepts reviewed pull requests (the "Protect main" ruleset). So the
# workflow that runs is also the reviewed one. These checks run inside the workflow, which a tag on an
# unreviewed commit could change. The enforcement that cannot be edited away sits outside it:
#
# - the tag ruleset that limits who may create image/* tags;
# - the `image-release` environment's required reviewer and its image/* deployment rule;
# - the publisher role's trust in AWS.
#
# **No `latest`, ever.** Two immutable tags per image (`<short>`, `sha-<full>`) for humans, and the
# digest for machines: a production manifest names `image@sha256:<digest>` and nothing else.
#
# **The scanner is accepted before it is pushed.** Its Dockerfile installs unpinned Ubuntu packages, so
# every rebuild may carry a different ClamAV or c-icap. The job records both versions and runs
# infra/antivirus/probe.mjs — a clean payload passed, EICAR blocked with a named threat — on the
# freshly built image, again after a restart (STG-8/9), and a third time on the pulled digest. A
# scanner that answers 204 to everything never reaches the registry.

name: Publish images

on:
  push:
    tags:
      - 'image/**'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

permissions:
  contents: read
  packages: read # the @munaxa/* npm packages on GitHub Packages, read during the build
  id-token: write # GitHub OIDC, for the image publisher role

env:
  AWS_REGION: eu-central-1
  REGISTRY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com
  PUBLISHER_ROLE_ARN: arn:aws:iam::229251310592:role/munaxa-docs/bootstrap/munaxa-docs-eu-prod-image-publisher

jobs:
  source:
    name: Resolve the source commit
    runs-on: ubuntu-latest
    permissions:
      contents: read # no registry, no AWS
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Read the commit from the tag name
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="${REF_NAME#image/}"
          # A full SHA only: a short one is ambiguous in principle, and a branch name is mutable —
          # either would make "what was published" a question with more than one answer.
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag must be image/<40-hex commit SHA>, got '$REF_NAME'"; exit 1
          fi
          # The tag must point at the commit it names: the workflow that runs is then the one in the
          # release commit, which the ancestry check below ties to reviewed history.
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "::error::tag $REF_NAME points at $GITHUB_SHA, not at the commit it names"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0 # the whole history, for the ancestry check against main

      - name: Confirm the commit is in reviewed history (on main)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main: only merged, reviewed commits are published"; exit 1
          fi
          echo "$SHA is on main"

      - name: Confirm the checkout is that commit and is clean
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::working tree not clean"; git status --porcelain; exit 1; }
          echo "Building $SHA"

  application:
    name: ${{ matrix.image }}
    needs: source
    runs-on: ubuntu-latest
    environment: image-release # required reviewer; the publisher trust requires this subject
    strategy:
      fail-fast: false # one image failing should not hide the other's result
      matrix:
        include:
          - image: munaxa-docs-api
            repository: munaxa-docs/api
            target: api
          - image: munaxa-docs-web
            repository: munaxa-docs/web
            target: web
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
      # Job-level env cannot read the env context; the registry host is written out.
      REPOSITORY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com/${{ matrix.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      # The registry credential for `@munaxa/*`, as a build *secret* rather than a build argument: an
      # argument is recorded in the image's history. The same construction the CI images job uses.
      - name: Write the package-registry credential for the build secret
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assume the image publisher role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to ECR
        # A 12-hour registry token from the role's session, piped straight to docker; never echoed.
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REPOSITORY }}:${{ env.SHORT }}
            ${{ env.REPOSITORY }}:sha-${{ env.SHA }}
          secret-files: npmrc=${{ runner.temp }}/npmrc
          # A single-platform manifest, so the digest names the image itself rather than an index
          # over it. Predictable pinning matters more than multi-arch, which nothing here asks for.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.SHORT }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Fail if no digest was produced
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::no digest was produced; nothing pinnable was published"; exit 1
          fi
          echo "Published $REPOSITORY@$DIGEST"

      - name: Pull by digest and verify the revision label
        env:
          REF: ${{ env.REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$REF"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REF")
          echo "revision label: $revision"
          [ "$revision" = "$SHA" ] || { echo "::error::revision label $revision != $SHA"; exit 1; }

          user=$(docker run --rm --entrypoint sh "$REF" -c 'id -un')
          [ "$user" != "root" ] || { echo "::error::image runs as root"; exit 1; }
          echo "runs as: $user"

          if docker history --no-trunc --format '{{.CreatedBy}}' "$REF" \
               | grep -qE 'ghp_|ghs_|github_pat_|_authToken=[A-Za-z0-9]'; then
            echo "::error::a credential appears in image history"; exit 1
          fi
          if docker run --rm --entrypoint sh "$REF" -c \
               'find / -name ".npmrc" 2>/dev/null | xargs -r grep -l "_authToken=[A-Za-z0-9]" 2>/dev/null' | grep -q .; then
            echo "::error::an npmrc carrying a token is present in the image"; exit 1
          fi
          echo "no credentials in history or filesystem"

      # Phase 9.2: the query engine the runtime's OpenSSL asks for must be in the image.
      - name: The API image carries the query engine its own runtime asks for
        if: matrix.target == 'api'
        env:
          REF: ${{ env.REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "$REF" -eu -c '
            ssl=$(ls /usr/lib/x86_64-linux-gnu/libssl.so.* 2>/dev/null | sed -n "s/.*libssl\.so\.\([0-9]\).*/\1/p" | head -1)
            case "${ssl:-}" in
              3) want=debian-openssl-3.0.x ;;
              1) want=debian-openssl-1.1.x ;;
              *) echo "Could not determine the runtime OpenSSL major version."; exit 1 ;;
            esac
            find /app/node_modules -name "libquery_engine-$want.so.node" | grep -q . \
              || { echo "FAIL - no libquery_engine-$want.so.node"; exit 1; }
            echo "OK - query engine $want present"
          '

      # STG-12: the pulled web image serves every branding URL its login page references, plus the
      # one favicon the release package names explicitly.
      - name: The web image serves the Munaxa artwork
        if: matrix.target == 'web'
        env:
          REF: ${{ env.REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name web-verify -e PORT=3000 -e NEXT_PUBLIC_API_URL=http://127.0.0.1:9 \
            -p 127.0.0.1:3000:3000 "$REF"
          trap 'docker rm -f web-verify >/dev/null' EXIT
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 1; done
          paths=$(curl -sf http://127.0.0.1:3000/login | grep -oE '(src|href)="/branding/[^"]+"' \
            | sed -E 's/^[a-z]+="([^"]+)"$/\1/' | sort -u)
          echo "$paths" | grep -q '/favicon/' || { echo "FAIL - the login page references no favicon."; exit 1; }
          echo "$paths" | grep -q '/logos/'   || { echo "FAIL - the login page references no logo."; exit 1; }
          failed=0
          for path in $paths /branding/docs/favicon/favicon-32.png; do
            answer=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://127.0.0.1:3000$path")
            echo "$path -> $answer"
            case "$answer" in "200 image/"*) ;; *) failed=1 ;; esac
          done
          [ "$failed" = 0 ] || { echo "FAIL - the web image does not serve its artwork."; docker logs web-verify | tail -20; exit 1; }
          echo "OK - every branding asset is served."

      # An artifact rather than a job output: a matrix's legs overwrite each other's outputs.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p digests && printf '%s@%s\n' "$REPOSITORY" "$DIGEST" > "digests/$TARGET"
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| source commit | \`$SHA\` |"
            echo "| reference | \`$REPOSITORY@$DIGEST\` |"
            echo "| revision label | verified \`$SHA\` |"
            echo "| run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}
          retention-days: 90

  antivirus:
    name: munaxa-docs-antivirus
    needs: source
    runs-on: ubuntu-latest
    environment: image-release
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      clamav: ${{ steps.versions.outputs.clamav }}
      cicap: ${{ steps.versions.outputs.cicap }}
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
      REPOSITORY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com/munaxa-docs/antivirus
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: docker/setup-buildx-action@v3

      # Built and loaded first, and only pushed once it has proved it scans.
      - name: Build the scanner (not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: infra/antivirus
          push: false
          load: true
          tags: munaxa-docs-antivirus:candidate
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.SHORT }}
            org.opencontainers.image.title=munaxa-docs-antivirus

      - name: Record the scanner versions this build installed
        id: versions
        run: |
          set -euo pipefail
          clamav=$(docker run --rm --entrypoint clamd munaxa-docs-antivirus:candidate --version | head -1)
          cicap=$(docker run --rm --entrypoint c-icap munaxa-docs-antivirus:candidate -V 2>&1 | head -1)
          packages=$(docker run --rm --entrypoint dpkg-query munaxa-docs-antivirus:candidate \
            -W -f '${Package}=${Version}\n' clamav-daemon clamav-freshclam c-icap libc-icap-mod-virus-scan)
          echo "clamd --version: $clamav"
          echo "c-icap -V:       $cicap"
          echo "$packages"
          [ -n "$clamav" ] && [ -n "$cicap" ] || { echo "::error::could not read scanner versions"; exit 1; }
          echo "clamav=$clamav" >> "$GITHUB_OUTPUT"
          echo "cicap=$cicap" >> "$GITHUB_OUTPUT"
          { echo "packages<<EOF"; echo "$packages"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Probe the candidate — clean passed, EICAR blocked
        run: |
          set -euo pipefail
          docker volume create av-signatures >/dev/null
          docker run -d --name av-candidate -p 127.0.0.1:1344:1344 \
            -v av-signatures:/var/lib/clamav munaxa-docs-antivirus:candidate
          # freshclam fetches the official databases at start, so the first probe waits for them.
          node infra/antivirus/probe.mjs icap://127.0.0.1:1344/avscan --wait 600 \
            || { docker logs av-candidate | tail -40; exit 1; }

      # The container never starts as root, the signature update still works as its user, and no
      # credential reached the image.
      - name: The candidate runs as non-root and carries no credentials
        run: sh infra/antivirus/verify-container.sh av-candidate munaxa-docs-antivirus:candidate

      # STG-8/STG-9: a restart — including after an unclean stop — must come back scanning, on the
      # signatures already in the volume.
      - name: Probe again after an unclean restart
        run: |
          set -euo pipefail
          docker kill av-candidate >/dev/null
          docker start av-candidate >/dev/null
          node infra/antivirus/probe.mjs icap://127.0.0.1:1344/avscan --wait 300 \
            || { docker logs av-candidate | tail -40; exit 1; }
          docker rm -f av-candidate >/dev/null

      - name: Assume the image publisher role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authenticate to ECR
        # A 12-hour registry token from the role's session, piped straight to docker; never echoed.
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

      # The probed image itself is pushed — tagged and pushed, not rebuilt — so the digest in the
      # registry is the image the probes above accepted, layer for layer.
      - name: Push the accepted scanner
        id: build
        run: |
          set -euo pipefail
          for tag in "$SHORT" "sha-$SHA"; do
            docker tag munaxa-docs-antivirus:candidate "$REPOSITORY:$tag"
            docker push "$REPOSITORY:$tag"
          done
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' munaxa-docs-antivirus:candidate \
            | grep "^$REPOSITORY@" | head -1 | sed 's/^.*@//')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the pushed digest is the image that was probed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          CLAMAV: ${{ steps.versions.outputs.clamav }}
          CICAP: ${{ steps.versions.outputs.cicap }}
          # Multi-line, so it travels as an env value rather than inline in the script.
          PACKAGES: ${{ steps.versions.outputs.packages }}
        run: |
          set -euo pipefail
          printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no digest"; exit 1; }
          ref="$REPOSITORY@$DIGEST"
          candidate=$(docker inspect --format '{{.Id}}' munaxa-docs-antivirus:candidate)
          # Drop every local name for the image, so the pull below really fetches from the registry.
          docker rmi "$REPOSITORY:$SHORT" "$REPOSITORY:sha-$SHA" munaxa-docs-antivirus:candidate >/dev/null
          docker pull "$ref"
          [ "$(docker inspect --format '{{.Id}}' "$ref")" = "$candidate" ] \
            || { echo "::error::the pushed image is not the probed candidate"; exit 1; }
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")
          [ "$revision" = "$SHA" ] || { echo "::error::revision label $revision != $SHA"; exit 1; }
          [ "$(docker run --rm --entrypoint clamd "$ref" --version | head -1)" = "$CLAMAV" ] || { echo "::error::ClamAV version drifted"; exit 1; }
          [ "$(docker run --rm --entrypoint c-icap "$ref" -V 2>&1 | head -1)" = "$CICAP" ] || { echo "::error::c-icap version drifted"; exit 1; }
          docker run -d --name av-pulled -p 127.0.0.1:1344:1344 -v av-signatures:/var/lib/clamav "$ref"
          node infra/antivirus/probe.mjs icap://127.0.0.1:1344/avscan --wait 300 \
            || { docker logs av-pulled | tail -40; exit 1; }
          docker rm -f av-pulled >/dev/null
          {
            echo "### munaxa-docs-antivirus"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| source commit | \`$SHA\` (infra/antivirus) |"
            echo "| reference | \`$ref\` |"
            echo "| revision label | verified \`$SHA\` |"
            echo "| ClamAV | \`$CLAMAV\` |"
            echo "| c-icap | \`$CICAP\` |"
            echo "| probe.mjs | exit 0 on the candidate, after an unclean restart, and on the pulled digest |"
            echo "| run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p digests && printf '%s\n' "$ref" > digests/antivirus
          printf 'clamd --version: %s\nc-icap -V: %s\n' "$CLAMAV" "$CICAP" > digests/antivirus-versions
          printf '%s\n' "$PACKAGES" >> digests/antivirus-versions

      - uses: actions/upload-artifact@v4
        with:
          name: digest-antivirus
          path: digests/
          retention-days: 90

  pull-identity:
    name: Confirm the release in ECR
    needs: [source, application, antivirus]
    runs-on: ubuntu-latest
    environment: image-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: The three references this run published
        run: |
          set -euo pipefail
          cat digests/api digests/web digests/antivirus digests/antivirus-versions
          {
            echo "### Release images"
            echo ""
            echo '```'
            cat digests/api digests/web digests/antivirus
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Production pulls with the ECS execution roles, which only ECS can assume, so this job checks
      # the registry itself: every published digest exists in its ECR repository.
      - name: Assume the image publisher role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Every digest is in ECR
        run: |
          set -euo pipefail
          for ref in $(cat digests/api digests/web digests/antivirus); do
            repo="${ref#"$REGISTRY"/}"; repo="${repo%@*}"; digest="${ref#*@}"
            aws ecr describe-images --repository-name "$repo" --image-ids imageDigest="$digest" \
              --query 'imageDetails[0].imageDigest' --output text | grep -qx "$digest"
            echo "| $repo | \`$digest\` present in ECR |" >> "$GITHUB_STEP_SUMMARY"
          done

      # The release smoke runs in a job with no OIDC permission and no environment (below), so it
      # cannot mint an AWS session at all. This job, which already holds the publisher session, pulls
      # the three digests for it and hands them over as an artifact, with each image's local id: the
      # smoke loads them and refuses to run unless every id matches what was pulled here.
      - name: Pull the three digests for the release smoke
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY" >/dev/null
          mkdir -p smoke-images
          for name in api web antivirus; do
            ref=$(head -1 "digests/$name")
            printf '%s' "$ref" | grep -Eq "^$REGISTRY/munaxa-docs/$name@sha256:[0-9a-f]{64}$" \
              || { echo "::error::digests/$name is not an ECR digest reference: $ref"; exit 1; }
            docker pull --quiet "$ref" >/dev/null
            docker tag "$ref" "release-smoke/$name:$GITHUB_RUN_ID"
            printf '%s %s %s\n' "$name" "$ref" \
              "$(docker image inspect --format '{{.Id}}' "release-smoke/$name:$GITHUB_RUN_ID")" \
              >> smoke-images/identity
          done
          docker logout "$REGISTRY" >/dev/null
          docker save "release-smoke/api:$GITHUB_RUN_ID" "release-smoke/web:$GITHUB_RUN_ID" \
            "release-smoke/antivirus:$GITHUB_RUN_ID" | gzip -1 > smoke-images/images.tar.gz
          cat smoke-images/identity

      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke-images
          path: smoke-images/
          retention-days: 1
          compression-level: 0 # already gzipped

  # The release smoke on the digests this run pushed (scripts/release-smoke/): a staging-shaped stack
  # from the three images, as pulled from ECR, and the blocking checks of runbook §16 and the release
  # package. A failure fails the run, and digests whose run failed are never deployed.
  #
  # Credentials: none. This job has no `id-token` permission and no environment, so it cannot
  # request a GitHub OIDC token or assume any AWS role, and nothing it runs (the dependency install,
  # the migrations, the stack) can either. The images come from `pull-identity`, which pulled them
  # from ECR by digest; they are loaded here and checked against the ids recorded at the pull. The
  # stack runs on the runner with its own generated secrets, a local object store and a local mail
  # capture.
  release-smoke:
    name: Release smoke on the published digests
    needs: [source, pull-identity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pnpm install, for the repository's migration runner
    env:
      SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - uses: actions/download-artifact@v4
        with:
          name: release-smoke-images
          path: smoke-images

      - name: Confirm this job holds no AWS or OIDC credential
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::this job can request an OIDC token; refusing to run the smoke"; exit 1
          fi
          if env | grep -q '^AWS_\(ACCESS_KEY_ID\|SECRET_ACCESS_KEY\|SESSION_TOKEN\|ROLE_ARN\|WEB_IDENTITY_TOKEN_FILE\)=.'; then
            echo "::error::an AWS credential variable is set; refusing to run the smoke"; exit 1
          fi
          if aws sts get-caller-identity >/dev/null 2>&1; then
            echo "::error::an AWS credential is usable; refusing to run the smoke"; exit 1
          fi
          echo "no OIDC token request and no usable AWS credential"

      - name: Load the published images and confirm they are the digests this run pushed
        id: images
        run: |
          set -euo pipefail
          gunzip -c smoke-images/images.tar.gz | docker load
          for name in api web antivirus; do
            read -r _ ref id < <(grep "^$name " smoke-images/identity)
            [ "$ref" = "$(head -1 "digests/$name")" ] \
              || { echo "::error::$name: pulled $ref, but this run published $(head -1 "digests/$name")"; exit 1; }
            local_ref="release-smoke/$name:$GITHUB_RUN_ID"
            loaded=$(docker image inspect --format '{{.Id}}' "$local_ref")
            [ "$loaded" = "$id" ] \
              || { echo "::error::$name: loaded image $loaded is not the image pulled from $ref ($id)"; exit 1; }
            echo "$name=$local_ref" >> "$GITHUB_OUTPUT"
            echo "$name-ref=$ref" >> "$GITHUB_OUTPUT"
          done

      - uses: pnpm/action-setup@v6
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the object store binaries
        id: object-store-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/object-store/bin
          key: object-store-${{ runner.os }}-minio-07c3a429bfed433e49018cb0f78a52145d4bedeb-mc-7394ce0dd2a80935aded936b09fa12cbb3cb8096

      - uses: actions/setup-go@v6
        if: steps.object-store-cache.outputs.cache-hit != 'true'
        with:
          go-version: '1.24'
          cache: false

      - name: Build the object store from its pinned source
        if: steps.object-store-cache.outputs.cache-hit != 'true'
        run: bash scripts/release-smoke/build-object-store.sh "$RUNNER_TEMP/object-store"

      - name: Release smoke
        run: |
          set -euo pipefail
          {
            echo "### Release smoke inputs"
            echo ""
            echo "| image | digest pulled from ECR |"
            echo "| --- | --- |"
            echo "| api | \`$API_REF\` |"
            echo "| web | \`$WEB_REF\` |"
            echo "| antivirus | \`$AV_REF\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/release-smoke/run.sh
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          AV_IMAGE: ${{ steps.images.outputs.antivirus }}
          API_REF: ${{ steps.images.outputs.api-ref }}
          WEB_REF: ${{ steps.images.outputs.web-ref }}
          AV_REF: ${{ steps.images.outputs.antivirus-ref }}
          EXPECTED_REVISION: ${{ needs.source.outputs.sha }}
          OBJECT_STORE_BIN: ${{ runner.temp }}/object-store/bin
