name: CI

on:
  # No `paths-ignore` here, and that is the point.
  #
  # `main` became a protected branch whose ruleset requires all seven of this workflow's checks,
  # and a required check that never reports is not a skipped check — it stays *pending* forever and
  # the pull request can never merge. A path filter and a required status check disagree about what
  # "did not run" means: the filter means "nothing to test", the ruleset means "not yet proven".
  #
  # It was measured rather than predicted. PR #42 published the Phase 9.6 certification report — one
  # Markdown file, 349 insertions, no conflicts — and produced **zero** workflow runs, **zero**
  # check runs, and `mergeable_state: blocked`. The report that certified the repository could not
  # be merged into the repository it certified.
  #
  # The published remedy is a second workflow with jobs of the same names that trivially succeed
  # when only documentation changed. It is rejected here, because when a pull request touches both
  # a Markdown file and a source file *both* workflows fire and both publish a check of the same
  # name — and the shim finishes in seconds while the real suite takes ten minutes. For that window
  # the ruleset sees a green check with the right name and the branch looks mergeable before
  # anything has been tested. A merge gate with a ten-minute window of false green is worse than
  # the wedge it fixes.
  #
  # So pull requests simply run the suite, always. What that costs is runner minutes on a
  # documentation change. What it buys is that every context the ruleset requires is a context this
  # workflow actually produced, with no path on which a check can be satisfied by anything other
  # than the work it names.
  pull_request:
    branches: [main]
  # Also on the branch itself, before a pull request exists.
  #
  # Without this, nothing had ever run the install path: the workflow fired only on pull
  # requests, so a lockfile that could not install sat undetected from Phase 0.5 until somebody
  # tried it by hand. Feedback that arrives only at review time is feedback that arrives after
  # the work.
  #
  # The filter stays here. A push run gates nothing — it is feedback while the work is in progress,
  # and `main` can only be reached through a pull request now, which has already run the suite. The
  # wedge above is a property of required checks, and only pull requests are subject to them.
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  # Manually, from the Actions tab. Phase 7's CI investigation stalled because the only way to
  # re-run a workflow was to push a commit that changed a non-Markdown file — which means the
  # cheapest diagnostic step, "run it again unchanged", was the one step unavailable.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  node:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      # The shared design system is published from munaxa-platform to GitHub Packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The one failure mode above cannot see. `@source` is what pulls the platform's utility
      # classes into this application's stylesheet, and when it stops resolving the build still
      # succeeds — it just emits a stylesheet missing every class only the platform uses. Phase 19
      # found that state in production-bound code with all six gates green.
      - name: Verify the platform stylesheet
        run: pnpm verify:styles

      # Colour contrast and screenshots, in real Chromium. Separate from `Test` because both read
      # the *built* stylesheet: jsdom has no cascade, so contrast cannot be judged there, and a
      # screenshot needs layout. Chromium is downloaded by the browser install below rather than
      # bundled, so this step is where a broken palette or an accidental restyle is caught.
      - name: Install Chromium
        run: pnpm --filter @edms/web exec playwright install --with-deps chromium

      - name: Accessibility contrast and visual regression
        run: pnpm test:visual

      # A failing screenshot is otherwise invisible: the harness writes `<name>.diff.png` and
      # `<name>.actual.png` next to the baseline, and both die with the runner. Without them the
      # only evidence of a visual regression is a pixel count, which cannot distinguish "the button
      # moved" from "this machine has a different font".
      - name: Upload the screenshots when they disagree
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: apps/web/src/test/__screenshots__/
          retention-days: 7

  integration:
    name: Integration · real PostgreSQL, two tenants
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # The suite exists because two Phase 1 defects were invisible to unit tests: a revocation
    # rolled back by the exception that reported it, and row-level security applying to the table
    # owner. Both are properties of the database, and only the database can be asked about them.
    #
    # It ran only on developers' machines until now, which meant every claim about tenant
    # isolation, the audit hash chain, cascade restores and workflow immutability was verified
    # exactly where it is least likely to be verified again.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edms_owner
          POSTGRES_PASSWORD: ci-only-not-a-secret
          # Trust, because this cluster exists for the length of one job and is reachable only
          # from it. It also keeps the tenant URLs below password-free, so a failing step cannot
          # print a credential-shaped string into a public log.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edms_owner -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # Object storage, added in Phase 6.12 — and it is a gate rather than a convenience.
      #
      # That phase found that **no upload could complete on S3 or R2**: the adapter never signed the
      # digest into the presigned target and never asked for it back, so `head()` answered null and
      # every upload was refused. It was invisible for eighteen phases because `LOCAL` hashes bytes
      # itself, and because nothing in CI had ever spoken to an object store. The regression guard
      # asserts that the *store* refuses bytes that disagree with their digest, which is a property
      # only a real store has.
      #
      # The object store is NOT a service container — see "Start the object store" below for why.

    env:
      NODE_ENV: test
      LOG_LEVEL: fatal
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-secret-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: NONE
      # Where the Phase 6.12 storage guard finds the object store. The suite's own adapter is
      # constructed against these; `STORAGE_DRIVER` stays NONE because every other integration test
      # is written against the driver-less profile and widening that is a different phase's job.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: munaxa-docs
      STORAGE_ACCESS_KEY_ID: edms-local
      STORAGE_SECRET_ACCESS_KEY: ci-only-not-a-secret
      SEARCH_DRIVER: POSTGRES
      OCR_DRIVER: NONE
      MAIL_DRIVER: NONE
      AV_DRIVER: NONE

      # Two tenants in two databases, which is what the isolation suite needs to run at all. It
      # skips rather than passes when the second is absent, so without this the most important
      # assertions in the product would be reported as a green build.
      DATABASE_URL: postgresql://edms_app@127.0.0.1:5432/ci_edms_acme
      DATABASE_MIGRATION_URL: postgresql://edms_owner@127.0.0.1:5432/ci_edms_acme
      SECOND_DATABASE_URL: postgresql://edms_app@127.0.0.1:5432/ci_edms_rival
      SECOND_DATABASE_MIGRATION_URL: postgresql://edms_owner@127.0.0.1:5432/ci_edms_rival

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `CREATE DATABASE` cannot run inside a transaction, and the cluster's roles are
      # cluster-scoped, so both are psql rather than the migration runner. Everything after this
      # point is the repository's own tooling, unmodified — which is the point: the job proves the
      # documented procedure, not a CI-only shortcut that could drift from it.
      - name: Create the tenant databases and the cluster roles
        run: |
          set -euo pipefail
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE ci_edms_acme OWNER edms_owner' \
            -c 'CREATE DATABASE ci_edms_rival OWNER edms_owner'
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/sql/cluster/01-roles.sql
        env:
          ADMIN_URL: postgresql://edms_owner@127.0.0.1:5432/postgres

      # An ordinary container rather than a `services:` entry, because the image needs an argument a
      # service entry cannot give it.
      #
      #   minio/minio:RELEASE.…  Cmd = ["minio"]        → prints its usage text and exits
      #   the server needs        minio server /data
      #
      # The runner composes service containers as `docker create <options> <image>` with no argument
      # slot, so a bare `minio` was all it could ever run: the container died on startup, the health
      # check never went healthy, and the job failed at "Initialize containers" before checkout.
      # Every run since Phase 6.12 added the service failed exactly that way, which went unnoticed
      # because the account could not assign runners over the same period — the red X already had an
      # unrelated explanation.
      #
      # `minio/minio:edge-cicd` does default to `server /data` and was tried first, but it is a
      # four-year-old build whose bundled `mc` predates the `mc ready` subcommand, so the health
      # check could never pass and the storage guard would have been asserting against a MinIO far
      # older than anything this product would run against.
      #
      # Pinned to a release rather than `latest`: an unpinned object store is a dependency that can
      # change the meaning of a passing build without a commit.
      - name: Start the object store
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=edms-local \
            -e MINIO_ROOT_PASSWORD=ci-only-not-a-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      # The bucket, for the same reason the databases are created here: an object store has no
      # bucket until somebody makes one, and the storage guard has nothing to write into without it.
      #
      # This step is also where readiness is established, now that no health check does it. `mc` is
      # downloaded fresh rather than taken from the image, so the client is current even though the
      # server is pinned.
      - name: Create the object storage bucket
        run: |
          set -euo pipefail
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
          chmod +x "$RUNNER_TEMP/mc"
          for attempt in $(seq 1 40); do
            if "$RUNNER_TEMP/mc" alias set ci http://127.0.0.1:9000 edms-local ci-only-not-a-secret; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::the object store never accepted a connection"
              docker logs minio
              exit 1
            fi
            sleep 2
          done
          "$RUNNER_TEMP/mc" mb --ignore-existing ci/munaxa-docs

      # The same runner an operator uses, reading the same catalogue the API reads. It applies the
      # per-database SQL, the schema and the post-migration SQL to each tenant in turn — so a
      # release that would leave one customer's database unmigrated fails here.
      - name: Migrate every tenant database
        run: node scripts/migrate-tenants.mjs
        env:
          TENANT_CATALOGUE: >-
            {"defaults":{"databaseUrlTemplate":"postgresql://edms_app@127.0.0.1:5432/ci_edms_{slug}",
            "migrationUrlTemplate":"postgresql://edms_owner@127.0.0.1:5432/ci_edms_{slug}",
            "storage":{"driver":"LOCAL","container":"munaxa-docs","prefixTemplate":"tenants/{slug}"},
            "search":{"indexTemplate":"docs-{slug}"}},
            "tenants":[{"id":"019489f0-0000-7000-8000-0000000000a1","slug":"acme"},
            {"id":"019489f0-0000-7000-8000-0000000000b2","slug":"rival"}]}

      # Through turbo rather than straight into the package, because the suites import the
      # workspace packages by their published entry points and those are built output. Running the
      # package script directly resolves `@edms/domain` to a `dist` that does not exist on a fresh
      # checkout — which is exactly how this job failed the first time it ran.
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: End-to-end · ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # The nine end-to-end files are the only thing that exercises the product as a product: the
    # real API artefact, `next start` over the production build, a real browser, a real database and
    # a real Redis. Until now they ran on developers' machines and nowhere else — so every fix this
    # audit made (the fixture teardown, reflow at 320, the menu modality) was guarded only by
    # somebody remembering to run them.
    #
    # ## Why this is a matrix and not one job
    #
    # `auth.login` is rate limited to **ten attempts per five minutes per IP**, and the guard is
    # real: `rate-limit.ts` declares it and the API enforces it against Redis. The nine files need
    # about nineteen sign-ins between them — each file seeds its own tenant and its own users, so
    # there is no session any two of them could share — and the whole suite finishes inside one
    # five-minute window. One job would therefore spend the budget on itself and fail on `429`s
    # that look like "the page never navigated".
    #
    # The limiter is not the thing to change. Each shard below is a separate job with its own Redis
    # and its own API instance, so each gets its own budget, and the shards are split by **login
    # cost** rather than by file count:
    #
    #   signing     — signing 5, faded-text 1, search 1     =  7
    #   recovery    — recovery 7, datagrid-keyboard 1       =  8
    #   screens     — consistency 1, shell 1, dashboard 1, recent-empty 1, permissions 4 = 8
    #   delegations — delegations 4, notifications 3       =  7
    #
    # Every shard stays under ten, and the product's security boundary is untouched. If a file's
    # sign-in count grows, the shard it lives in is where that shows up.
    #
    # **A sign-in is any `POST /auth/login`, not only a browser one.** `rate-limit.guard.ts` pushes
    # one key *per declared dimension* rather than one key per combination, so `auth.login`'s `ip`
    # dimension is a single bucket for the whole runner and the `bearerFor` helpers that mint a
    # token with `fetch` spend from the same ten as `signInAndCapture` does. The counts above are
    # browser sign-ins only, which is why they read low: `search` alone adds five tokens on top of
    # its one. What keeps that survivable is that the window is a fixed 300s from first touch rather
    # than a sliding one, so a shard running longer than five minutes spends across several windows.
    #
    # It is survivable, not comfortable, and `delegations` is where it stopped being either. Added
    # to the signing shard as a fourth file it failed in run 32420993648 with the auditor's sign-in
    # timing out on `/login` — the shape an exhausted login budget takes, since a `429` leaves the
    # form exactly where it was and `waitForURL` reports only that nothing navigated. That is the
    # leading explanation rather than a proven one: the uploaded server log is the *last* file's
    # boot, and `LOG_LEVEL=fatal` keeps refusals out of it, so nothing in the artefact says `429`.
    # Its own shard removes the pressure either way — a separate job is a separate Redis, a separate
    # API and a separate budget — and the six tests pass locally against the real stack every run.
    #
    # The shard *names* are check names that branch protection matches on. Renaming one is a
    # protection change; adding one is not, which is why a new file that does not fit gets a shard
    # rather than a retitled neighbour.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: 'signing, faded text and search'
            files: 'src/test/e2e/signing.e2e.spec.ts src/test/e2e/faded-text.e2e.spec.ts src/test/e2e/search.e2e.spec.ts'
          - name: 'recovery and the data grid'
            files: 'src/test/e2e/recovery.e2e.spec.ts src/test/e2e/datagrid-keyboard.e2e.spec.ts'
          - name: 'the screens'
            files: 'src/test/e2e/consistency.e2e.spec.ts src/test/e2e/shell.e2e.spec.ts src/test/e2e/dashboard.e2e.spec.ts src/test/e2e/recent-empty.e2e.spec.ts src/test/e2e/permissions.e2e.spec.ts'
          # Named for the file it was created for. It carries the notification suite too, because
          # this is the shard with the measured budget for it — see the note above about titles.
          - name: 'delegations'
            files: 'src/test/e2e/delegations.e2e.spec.ts src/test/e2e/notifications.e2e.spec.ts'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edms_owner
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edms_owner -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The restore rehearsal restores *beside* the source rather than over it, and refuses to run
      # against a destination that is not empty — so it needs a second cluster, with a superuser,
      # that nothing else has touched. A second service container is exactly that, and it is
      # discarded with the job.
      postgres-dr:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      LOG_LEVEL: fatal
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-secret-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: NONE
      SEARCH_DRIVER: POSTGRES
      OCR_DRIVER: NONE
      MAIL_DRIVER: NONE
      AV_DRIVER: NONE
      DATABASE_URL: postgresql://edms_app@127.0.0.1:5432/e2e_edms_acme
      DATABASE_MIGRATION_URL: postgresql://edms_owner@127.0.0.1:5432/e2e_edms_acme
      SECOND_DATABASE_URL: postgresql://edms_app@127.0.0.1:5432/e2e_edms_rival
      SECOND_DATABASE_MIGRATION_URL: postgresql://edms_owner@127.0.0.1:5432/e2e_edms_rival
      DR_DEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5433/postgres
      TENANT_CATALOGUE: >-
        {"defaults":{"databaseUrlTemplate":"postgresql://edms_app@127.0.0.1:5432/e2e_edms_{slug}",
        "migrationUrlTemplate":"postgresql://edms_owner@127.0.0.1:5432/e2e_edms_{slug}",
        "storage":{"driver":"LOCAL","container":"munaxa-docs","prefixTemplate":"tenants/{slug}"},
        "search":{"indexTemplate":"docs-{slug}"}},
        "tenants":[{"id":"019489f0-0000-7000-8000-0000000000a1","slug":"acme"},
        {"id":"019489f0-0000-7000-8000-0000000000b2","slug":"rival"}]}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@munaxa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same two steps the integration job uses, against the databases the end-to-end
      # environment names. `CREATE DATABASE` cannot run inside a transaction and roles are
      # cluster-scoped, so both are psql rather than the migration runner.
      - name: Create the tenant databases and the cluster roles
        run: |
          set -euo pipefail
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE e2e_edms_acme OWNER edms_owner' \
            -c 'CREATE DATABASE e2e_edms_rival OWNER edms_owner'
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f infra/sql/cluster/01-roles.sql
        env:
          ADMIN_URL: postgresql://edms_owner@127.0.0.1:5432/postgres

      # The restore rehearsal recreates the roles on the destination itself, but it does so *after*
      # `pg_restore --create`; the cluster still has to exist and be reachable, which is what this
      # asserts before eight minutes of suite discovers otherwise.
      - name: Check the restore destination is reachable and empty
        run: |
          set -euo pipefail
          psql "$DR_DEST_ADMIN_URL" -v ON_ERROR_STOP=1 -c 'SELECT version()' >/dev/null
          count=$(psql "$DR_DEST_ADMIN_URL" -tAc "SELECT count(*) FROM pg_database WHERE datname LIKE '%edms%'")
          if [ "$count" != "0" ]; then
            echo "::error::the restore destination already holds $count edms database(s)"
            exit 1
          fi

      - name: Migrate every tenant database
        run: node scripts/migrate-tenants.mjs

      # The suite runs the artefacts the image ships — `apps/api/dist/main.js` and `next start` over
      # the production build — so it depends on a real build rather than compiling its own.
      - name: Build
        run: pnpm build

      # Chromium only. The suite drives one browser, and installing three costs minutes per shard.
      - name: Install Chromium
        run: pnpm --filter @edms/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @edms/web exec vitest run --project=e2e --fileParallelism=false ${{ matrix.shard.files }}

      # The API and the web server write to these, and a failure that only reproduces inside a full
      # run is unreadable without them: the route error boundary shows a correlation id and nothing
      # else, and the exception behind that id is in the API's log alone.
      - name: Upload the server logs when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs-${{ strategy.job-index }}
          path: |
            /tmp/e2e-api.log
            /tmp/e2e-web.log
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Container images · three targets from one commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # The gate Phase 18 added, and it exists because of what the alternative was. A Dockerfile that
    # nothing builds is a placeholder that looks like a deliverable: it stays plausible until a
    # release engineer runs it for the first time, under pressure, and discovers which `COPY` names
    # a path that does not exist. 20 §4's "every gate is blocking" applies to the images or it
    # applies to nothing.
    #
    # It builds and does not push. Publishing to a registry is a deployment decision — which
    # registry, under which credentials, with which retention — and this repository has none of
    # those answers. What it can assert is that the images build from this commit.
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # The registry credential, as a build *secret* rather than a build argument: an argument is
      # recorded in the image's history and readable by anybody who can `docker history` it.
      - name: Write the registry credential for the build secret
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The build stage is shared by all three targets and is the expensive one, so the cache is
      # what keeps this job from doubling the pipeline's wall-clock.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          # Loaded, unlike the other two, because the next step has to run something inside it.
          load: true
          tags: munaxa-docs-api:ci
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Phase 9.2. "It builds" was the only thing this job asserted, and the first time the image
      # was actually run — on a real deployment — every database call failed: Prisma had generated
      # its query engine for `debian-openssl-1.1.x` because the build stage carries no libssl to
      # detect, while the runtime stage carries OpenSSL 3. Readiness reported both tenant databases
      # DOWN and nothing could authenticate. The Dockerfile's own comment had predicted it.
      #
      # This asks the image the question the deployment asks: which engine does *your* runtime
      # require, and do you carry it? It needs no database and no network, so it is a build-time
      # gate rather than one more thing a release engineer discovers under pressure.
      - name: The API image carries the query engine its own runtime asks for
        run: |
          docker run --rm --entrypoint sh munaxa-docs-api:ci -eu -c '
            ssl=$(ls /usr/lib/x86_64-linux-gnu/libssl.so.* 2>/dev/null | sed -n "s/.*libssl\.so\.\([0-9]\).*/\1/p" | head -1)
            case "${ssl:-}" in
              3) want=debian-openssl-3.0.x ;;
              1) want=debian-openssl-1.1.x ;;
              *) echo "Could not determine the runtime OpenSSL major version."; exit 1 ;;
            esac
            echo "This runtime requires: $want"
            if find /app/node_modules -name "libquery_engine-$want.so.node" | grep -q .; then
              echo "OK - the image carries the query engine its own runtime asks for."
            else
              echo "FAIL - no libquery_engine-$want.so.node in this image. Present instead:"
              find /app/node_modules -name "libquery_engine-*" -printf "  %f\n" | sort -u
              exit 1
            fi
          '

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: false
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: false
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

  boundaries:
    name: Product isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The dependency rules are one-directional: this product may depend on the platform
      # and on nothing else in the ecosystem. Catching a stray cross-product import here is
      # far cheaper than untangling it after it ships.
      # This check could not fail until Phase 7.5. `FORBIDDEN` already began with `@` and the
      # pattern prefixed another one, so the expression searched for `from '@@school/` — which
      # `@` being a literal in ERE means no import statement can ever be. Every run since the job
      # was added printed "No cross-product imports." without being able to detect one. The
      # trailing `grep -v "@docs/"` compounded it by excluding a scope the list had just
      # forbidden; this repository's own packages are `@edms/` and `@munaxa/`, and nothing here
      # imports `@docs/`, so the exclusion guarded nothing and is gone.
      #
      # The pattern also covers double quotes and dynamic `import(...)`, because a rule that only
      # sees single-quoted static imports is a rule with a documented way around it.
      - name: No cross-product dependencies
        run: |
          set -euo pipefail
          FORBIDDEN='(school|work|docs|corporate)'
          if grep -rEn "(from|import\()[[:space:]]*['\"]@${FORBIDDEN}/" \
               --include=*.ts --include=*.tsx . \
               --exclude-dir=node_modules --exclude-dir=.git; then
            echo "::error::This repository imports another product. Shared code belongs in munaxa-platform."
            exit 1
          fi
          echo "No cross-product imports."
