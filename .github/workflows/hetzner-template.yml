name: Hetzner template

# Runs the Hetzner deployment template (infra/hetzner, ADR-0026) end to end in a disposable stack on
# the runner: the real api, web and antivirus images built from this commit, PostgreSQL, Redis, the
# test-only MinIO, then infra/hetzner/testing/run-stack-test.sh. It builds nothing for a registry,
# pushes nothing, deploys nothing, and contacts no cloud provider.
#
# A workflow of its own rather than a job in ci.yml, deliberately. ci.yml's checks are required by
# the `main` ruleset and carry no path filter, for the reason its header gives. This one is a new,
# NOT required check, so a path filter is safe here (a skipped run blocks nothing), and an evaluation
# of a hosting option that has not been accepted does not belong among the merge gates. Promoting it
# to a required check is a decision for whoever accepts ADR-0026.
#
# A pass of the `stack` job proves the template against MinIO only. It says nothing about Hetzner
# Object Storage or Cloudflare R2 (ADR-0026 §10, gate P-1).
#
# Gate P-1 is the `external-storage` job: the same stack test against a real, dedicated test bucket,
# through run-stack-test.sh's EXTERNAL_STORAGE_ENV (infra/hetzner/README.md §6). It runs only for a
# pushed tag `storage-test/<anything>`, or a branch push whose head commit message contains
# `[storage-test]` — workflow_dispatch is offered only for workflows on the default branch, which
# this one is not — and only inside the `r2-storage-test` environment, whose deployment rules name
# the refs allowed to read its secrets. Nothing in it is a production setting.

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/hetzner/**'
      - 'infra/antivirus/**'
      - 'infra/sql/**'
      - 'Dockerfile'
      - 'apps/**'
      - 'packages/**'
      - 'prisma/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hetzner-template.yml'
  push:
    branches-ignore: [main]
    # Path filters are not evaluated for tag pushes, so a `storage-test/*` tag always runs.
    tags: ['storage-test/**']
    paths:
      - 'infra/hetzner/**'
      - 'infra/antivirus/**'
      - '.github/workflows/hetzner-template.yml'
  workflow_dispatch:

concurrency:
  group: hetzner-template-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    name: Compose stack · real images, MinIO, production validation
    if: ${{ !startsWith(github.ref, 'refs/tags/storage-test/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Docker Hub authentication
        uses: ./.github/actions/docker-hub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
          login: 'true'

      - uses: docker/setup-buildx-action@v3

      # The same build secret, written the same way, as ci.yml's `images` job.
      - name: Write the registry credential for the build secret
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: munaxa-docs-api:stacktest
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: munaxa-docs-web:stacktest
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

      - name: Build the antivirus image
        uses: docker/build-push-action@v6
        with:
          context: infra/antivirus
          push: false
          load: true
          tags: munaxa-docs-antivirus:stacktest

      # PostgreSQL with the backup scripts (infra/hetzner/postgres; R-1).
      - name: Build the PostgreSQL image
        uses: docker/build-push-action@v6
        with:
          context: infra/hetzner/postgres
          push: false
          load: true
          tags: munaxa-docs-postgres:stacktest

      - name: Remove the registry credential
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"

      # The backup scripts on their own: encryption, refusals, retention, restore (README.md §7).
      # Before the stack test: both use the template's data subnet, so they never run together.
      - name: Backup script tests
        run: infra/hetzner/testing/backup/test-backup-scripts.sh
        env:
          DOCS_POSTGRES_IMAGE: munaxa-docs-postgres:stacktest

      # One signature download a day, as ci.yml does: ClamAV's mirrors throttle repeat fetches, and a
      # throttled scanner has nothing to scan with. The stack test seeds the scanner from this
      # directory and writes the current signatures back for the next run.
      - name: Date the signature cache
        id: signatures
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the ClamAV signatures
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/clamav-db
          key: hetzner-clamav-db-${{ steps.signatures.outputs.day }}
          restore-keys: hetzner-clamav-db-

      # With the backup drill (testing/backup/backup-drill.sh): point-in-time recovery and a tenant
      # restore from the stack's own data, with the audit chain, RLS and isolation checked.
      - name: Run the stack test with the backup drill
        run: infra/hetzner/testing/run-stack-test.sh
        env:
          DOCS_API_IMAGE: munaxa-docs-api:stacktest
          DOCS_WEB_IMAGE: munaxa-docs-web:stacktest
          DOCS_ANTIVIRUS_IMAGE: munaxa-docs-antivirus:stacktest
          DOCS_POSTGRES_IMAGE: munaxa-docs-postgres:stacktest
          EXTRA_CHECKS: infra/hetzner/testing/backup/backup-drill.sh
          CLAMAV_SEED_DIR: ${{ runner.temp }}/clamav-db
          CLAMAV_EXPORT_DIR: ${{ runner.temp }}/clamav-db

      # Signature refresh, staleness, refusal and the fail-open guard (R-10), with no network, on the
      # signatures the stack test just exported.
      - name: Scanner watch tests
        run: infra/antivirus/test-scanner-watch.sh
        env:
          DOCS_ANTIVIRUS_IMAGE: munaxa-docs-antivirus:stacktest
          CLAMAV_SEED_DIR: ${{ runner.temp }}/clamav-db

  # Gate P-1. The same images, the same test, the same harness — with the test MinIO replaced by
  # the dedicated R2 test bucket. A separate job only because the credentials must stay inside the
  # `r2-storage-test` environment; the steps up to the test are the `stack` job's.
  external-storage:
    name: Compose stack · real images, Cloudflare R2 test bucket (gate P-1)
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/storage-test/') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[storage-test]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-storage-test
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Docker Hub authentication
        uses: ./.github/actions/docker-hub-auth
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
          login: 'true'

      - uses: docker/setup-buildx-action@v3

      - name: Write the registry credential for the build secret
        run: |
          set -euo pipefail
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: munaxa-docs-api:stacktest
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: munaxa-docs-web:stacktest
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha

      - name: Build the antivirus image
        uses: docker/build-push-action@v6
        with:
          context: infra/antivirus
          push: false
          load: true
          tags: munaxa-docs-antivirus:stacktest

      - name: Remove the registry credential
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"

      - name: Date the signature cache
        id: signatures
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the ClamAV signatures
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/clamav-db
          key: hetzner-clamav-db-${{ steps.signatures.outputs.day }}
          restore-keys: hetzner-clamav-db-

      # The bucket under test, written to a private file the harness parses and never prints. The
      # endpoint and key pair are environment secrets (GitHub masks them in the log as well); the
      # rest is the bucket's non-sensitive configuration. The CORS origin is a test-only name under
      # the reserved `.invalid` domain: the bucket's CORS rule admits exactly this origin.
      - name: Write the storage-under-test file
        run: |
          set -euo pipefail
          umask 077
          for name in R2_TEST_ENDPOINT R2_TEST_ACCESS_KEY_ID R2_TEST_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::environment secret $name is not set in the r2-storage-test environment"
              exit 1
            fi
          done
          {
            echo 'STORAGE_DRIVER=R2'
            echo 'STORAGE_BUCKET=munaxa-docs-p1-storage-test'
            echo 'STORAGE_REGION=auto'
            echo "STORAGE_ENDPOINT=$R2_TEST_ENDPOINT"
            echo 'STORAGE_FORCE_PATH_STYLE=false'
            echo "STORAGE_ACCESS_KEY_ID=$R2_TEST_ACCESS_KEY_ID"
            echo "STORAGE_SECRET_ACCESS_KEY=$R2_TEST_SECRET_ACCESS_KEY"
            echo 'STORAGE_TEST_CORS_ORIGIN=https://p1-storage-test.munaxa.invalid'
          } > "$RUNNER_TEMP/storage-under-test.env"
        env:
          R2_TEST_ENDPOINT: ${{ secrets.R2_TEST_ENDPOINT }}
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}

      - name: Run the stack test against the R2 test bucket
        run: infra/hetzner/testing/run-stack-test.sh
        env:
          DOCS_API_IMAGE: munaxa-docs-api:stacktest
          DOCS_WEB_IMAGE: munaxa-docs-web:stacktest
          DOCS_ANTIVIRUS_IMAGE: munaxa-docs-antivirus:stacktest
          CLAMAV_SEED_DIR: ${{ runner.temp }}/clamav-db
          EXTERNAL_STORAGE_ENV: ${{ runner.temp }}/storage-under-test.env

      - name: Remove the storage-under-test file
        if: always()
        run: rm -f "$RUNNER_TEMP/storage-under-test.env"
