name: Bootstrap lockfile

# One-shot helper. The product repos cannot commit a pnpm-lock.yaml until
# @munaxa/* exists in GitHub Packages, and resolving it needs a token with
# read:packages — which only exists inside Actions. This dispatches a run that
# resolves the graph and commits the lockfile to the branch it ran against.
#
# Delete this workflow once every product repo has a committed lockfile.
on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to generate the lockfile on and commit back to'
        required: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  lockfile:
    name: Generate and commit pnpm-lock.yaml
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # No `cache: pnpm` here — that step requires the very lockfile we are creating.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve dependencies
        run: pnpm install --lockfile-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit lockfile
        run: |
          test -f pnpm-lock.yaml || { echo "::error::pnpm-lock.yaml was not generated"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage first: an untracked lockfile is invisible to `git diff`, so the
          # comparison has to run against the index, not the working tree.
          git add pnpm-lock.yaml
          if git diff --cached --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged; nothing to commit."
            exit 0
          fi
          git commit -m 'build: add pnpm-lock.yaml resolved against @munaxa/* 1.0.0'
          git push origin HEAD:${{ inputs.target_branch }}
