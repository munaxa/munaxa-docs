# Grype configuration for .github/scripts/scan-image.sh. Exceptions only: one rule per
# vulnerability, each with the owner who accepted it and an expiry, on the line above it:
#   # exception: <CVE> owner=<who approved> expires=<YYYY-MM-DD> reason=<why>
# The script refuses a rule without that line, a rule past its expiry, a rule whose owner is still
# pending, and any rule that ignores a class of findings (by fix state, severity or namespace).
#
# No exception is needed: since the api, web and migrate images moved to the Alpine runtime
# (20 Nov 2026) their scan has no HIGH or CRITICAL finding, so the Debian glibc CVE-2026-84243
# exception proposed earlier (decision D-G1) is withdrawn rather than accepted.
ignore: []
